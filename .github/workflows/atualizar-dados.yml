name: Atualizar dados

# Escopos:
#   clubes    -> baixa as ligas, atualiza dados.js (clubes/valores) e recalcula a fama
#   gols      -> atualiza gols/jogos (retoma de onde parou) e recalcula a fama
#   historico -> atualiza titulos + trajetoria (retoma de onde parou)
#   fama      -> so recalcula a fama (0 requisicoes)
#   tudo      -> clubes + gols + historico + fama

on:
  # Sem agendamento: o Transfermarkt bloqueia os IPs dos runners do GitHub
  # (HTTP 202 com corpo vazio - ver diagnostico_tm.txt), então as atualizações
  # são disparadas manualmente (workflow_dispatch) ou pela máquina local.
  workflow_dispatch:
    inputs:
      escopo:
        description: "O que atualizar"
        type: choice
        default: clubes
        options:
          - clubes
          - fama
          - gols
          - historico
          - tudo
      limite:
        description: "Limite de jogadores (gols/historico). Vazio = todos."
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet --disable-pip-version-check requests beautifulsoup4

      - name: Definir o escopo
        id: escopo
        env:
          EVENTO: ${{ github.event_name }}
          AGENDA: ${{ github.event.schedule }}
          ESCOLHA: ${{ inputs.escopo }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            valor="$ESCOLHA"
          else
            case "$AGENDA" in
              "0 6 1 * *")         valor="gols" ;;
              "0 7 15 1,4,7,10 *") valor="historico" ;;
              *)                   valor="clubes" ;;
            esac
          fi
          echo "valor=$valor" >> "$GITHUB_OUTPUT"
          echo "Escopo escolhido: $valor"

      - name: Rodar o pipeline
        env:
          LIMITE: ${{ inputs.limite }}
        run: |
          if [ -n "$LIMITE" ]; then
            python pipeline_dados.py --escopo "${{ steps.escopo.outputs.valor }}" --limite "$LIMITE"
          else
            python pipeline_dados.py --escopo "${{ steps.escopo.outputs.valor }}"
          fi

      - name: Conferir os dados
        run: |
          python - <<'PY'
          import re, sys
          t = open("dados.js", encoding="utf-8").read()
          m = re.search(r"const DATA=`(.*?)`;", t, re.S)
          n = len([l for l in (m.group(1).split("\n") if m else []) if l.strip()])
          print("jogadores no dados.js:", n)
          if n < 1000:
              sys.exit("dados.js com poucos jogadores (%d) - nao vou publicar" % n)
          PY

      - name: Publicar no repositorio
        run: |
          git config user.name "craque-bot"
          git config user.email "craque-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou nos dados."
            exit 0
          fi
          git commit -m "dados: ${{ steps.escopo.outputs.valor }} ($(date -u +%Y-%m-%d)) [skip netlify]"
          git push
