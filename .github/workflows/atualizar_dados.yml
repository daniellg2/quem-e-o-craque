name: Atualizar Base de Dados de Clubes (Transfermarkt)

on:
  schedule:
    # 40 = minuto, 2 = hora UTC (23:40 BRT), 1 = segunda-feira UTC (domingo BRT)
    - cron: '40 2 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas necessárias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Executar o script de atualização
        run: |
          # Executa o script que embute os escudos e dados no HTML
          python pegar_dados.py --html index.html --embutir-imagens

      - name: Salvar e publicar as alterações no repositório
        run: |
          git config --global user.name "Bot de Atualização"
          git config --global user.email "bot@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "bot: atualização semanal automática" && git push)
